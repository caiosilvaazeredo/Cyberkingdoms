<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>CyberKingdoms — Tiny Swords</title>
    <style>
      /* A interface usa os elementos do próprio pacote: papel, madeira, fita e
         barras. Não é economia de trabalho — é coerência. Um painel de vidro
         escuro sobre um mundo de pixel art anuncia que a interface e o jogo
         foram feitos por pessoas diferentes. */
      :root {
        --toque: 48px;
        --madeira: #6b4b2a;
        --tinta: #3a2415;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #1c799e;
        touch-action: none; overscroll-behavior: none;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        color: #f4e4c1;
      }
      #tela { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

      /* Todo painel é a mesma folha de papel do pacote, esticada por borda de
         imagem: assim uma caixa de qualquer tamanho mantém o canto desenhado
         sem esticar o miolo. */
      /* Nove fatias de 64 px, na imagem já compactada: o pacote guarda cada
         peça numa célula separada por um vão transparente, e o `border-image`
         fatiaria o vão junto — a caixa aparece esfarelada. `ui9/` é a mesma
         arte com as peças encostadas. */
      .ts-papel {
        border-style: solid;
        border-width: 22px;
        border-image: url('/tiny/ui9/paper.png') 64 fill stretch;
        image-rendering: pixelated;
        color: var(--tinta);
      }

      #hud-topo {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 0 4px;
        font-size: 13px; font-weight: bold;
        pointer-events: none;
      }
      .ts-ficha {
        display: flex; align-items: center; gap: 6px;
        min-height: 34px; padding: 0 6px;
        border-style: solid; border-width: 16px;
        border-image: url('/tiny/ui9/paper-dark.png') 64 fill stretch;
        image-rendering: pixelated;
        color: #f2e2bd;
        pointer-events: auto;
      }
      .ts-ficha img { width: 22px; height: 22px; image-rendering: pixelated; }

      /* As barras de vitais são as do pacote: base e preenchimento separados,
         exatamente como o jogo original as usa. */
      #vitais {
        position: fixed;
        left: max(8px, env(safe-area-inset-left));
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + 4px);
        display: flex; flex-direction: column; gap: 4px;
        pointer-events: none;
      }
      /* A barra também é 3 fatias: as duas tampas de madeira não podem
         esticar, só o miolo. */
      .ts-barra {
        position: relative; width: 200px; height: 34px;
        border-style: solid; border-width: 0 22px;
        border-image: url('/tiny/ui9/bar.png') 0 64 fill stretch;
        image-rendering: pixelated;
      }
      .ts-barra i {
        position: absolute; left: 4px; right: 4px; top: 50%;
        transform: translateY(-50%);
        height: 12px;
        background: url('/tiny/ui9/bar-fill.png') left center / auto 100% repeat-x;
        image-rendering: pixelated;
        transition: width 0.25s ease;
      }
      .ts-barra span {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; color: #2a1a0d; text-shadow: 0 1px 0 rgba(255,255,255,0.35);
      }

      #painel-acoes {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + 4px);
        width: min(300px, 60vw);
        padding: 4px 8px 10px;
      }
      #painel-acoes h2 {
        margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em; text-align: center;
      }
      #hud-ocupacao {
        margin: 0 0 8px; font-size: 11px; text-align: center; min-height: 15px;
      }
      #hud-acoes { display: flex; flex-direction: column; gap: 6px; }

      /* Botão do pacote, com o estado pressionado trocando a imagem — é o
         retorno tátil que o original tem e que um `:active` de CSS puro não
         reproduz. */
      .ts-botao {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: var(--toque); padding: 2px 6px;
        border-style: solid; border-width: 16px; cursor: pointer;
        border-image: url('/tiny/ui9/btn-blue.png') 64 fill stretch;
        image-rendering: pixelated;
        background: none;
        color: #fff; font: inherit; font-size: 12px; font-weight: bold;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
      }
      .ts-botao:active {
        border-image-source: url('/tiny/ui9/btn-blue-pressed.png');
        transform: translateY(2px);
      }
      .ts-botao span { font-size: 10px; opacity: 0.85; font-weight: normal; }

      .ts-botao.vermelho {
        border-image: url('/tiny/ui9/btn-red.png') 64 fill stretch;
      }
      .ts-botao.vermelho:active {
        border-image-source: url('/tiny/ui9/btn-red-pressed.png');
      }
      /* Três botões lado a lado não cabem: cada um carrega 16 px de moldura em
         cada borda, e o painel tem 300 px. Em grade de duas colunas eles
         crescem para baixo em vez de vazar para fora da tela. */
      #hud-terreno-botoes {
        display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
      }
      #hud-terreno-botoes .ts-botao {
        min-width: 0; border-width: 14px; font-size: 11px;
      }
      #hud-terreno-botoes .vermelho { grid-column: 1 / -1; }

      /* O mapa é a tela toda: escolher para onde ir é a decisão mais cara do
         jogo, e ela não cabe numa caixinha de canto. */
      #folha-mapa {
        position: fixed; z-index: 7; inset: 12px;
        display: flex; flex-direction: column;
        padding: 0 10px 10px;
      }
      #folha-mapa[hidden] { display: none; }
      #tela-mapa {
        flex: 1; min-height: 0; width: 100%;
        image-rendering: pixelated; cursor: crosshair;
        border: 3px solid rgba(58, 36, 21, 0.35); border-radius: 4px;
      }
      #ficha-viagem {
        display: flex; flex-direction: column; gap: 2px;
        min-height: 74px; padding-top: 6px;
        font-size: 12px; color: var(--tinta);
      }
      #ficha-viagem small { font-size: 10px; opacity: 0.85; }
      /* Sair sem mantimento é a única recusa que o jogo não faz por você: a
         viagem é permitida, e o aviso é o que separa uma escolha de um
         acidente. */
      #ficha-viagem .alerta { color: #a32c1c; opacity: 1; font-weight: bold; }
      #ficha-viagem .ts-botao { margin-top: 4px; border-width: 14px; }

      /* O aviso substitui o `alert`: um modal do navegador congela o laço de
         desenho, e o motivo de uma obra recusada não vale uma tela parada. */
      #aviso {
        position: fixed; z-index: 6;
        top: 25%; left: 50%; transform: translateX(-50%);
        width: max-content; max-width: min(380px, 80vw); padding: 10px 14px;
        border-style: solid; border-width: 18px;
        border-image: url('/tiny/ui9/paper-dark.png') 64 fill stretch;
        image-rendering: pixelated;
        color: #f2e2bd; font-size: 12px; text-align: center;
        opacity: 0; transition: opacity 0.25s ease;
        pointer-events: none;
      }
      #aviso:empty { display: none; }

      #folha-obras, #folha-feira {
        position: fixed; z-index: 5;
        top: max(60px, env(safe-area-inset-top));
        left: 50%; transform: translateX(-50%);
        width: min(460px, 92vw);
        max-height: 70vh; overflow: auto; overscroll-behavior: contain;
        padding: 0 10px 12px;
      }
      #folha-obras[hidden], #folha-feira[hidden] { display: none; }
      #folha-obras header, #folha-feira header, #folha-mapa header {
        display: flex; align-items: center; justify-content: space-between;
        position: sticky; top: 0;
      }
      #folha-obras h2, #folha-feira h2, #folha-mapa h2 {
        margin: 0; font-size: 13px; letter-spacing: 0.1em;
      }
      .ts-secao { margin: 12px 0 4px; opacity: 0.8; }
      .ts-dica { margin: 2px 0 8px; font-size: 10px; opacity: 0.75; }
      .ts-fechar {
        width: 34px; height: 34px; border: 0; cursor: pointer;
        background: url('/tiny/ui/SmallRedSquareButton_Regular.png') center / contain no-repeat;
        image-rendering: pixelated;
        color: #fff; font: inherit; font-size: 16px; line-height: 1;
      }
      .ts-fechar:active {
        background-image: url('/tiny/ui/SmallRedSquareButton_Pressed.png');
      }
      #lista-obras, #lista-feira, #lista-bolsa {
        display: flex; flex-direction: column; gap: 4px;
      }
      .ts-linha {
        display: flex; align-items: center; gap: 8px; text-align: left;
        min-height: var(--toque); padding: 4px 8px; cursor: pointer;
        border: 2px solid rgba(58, 36, 21, 0.25); border-radius: 4px;
        background: rgba(255, 255, 255, 0.18);
        color: var(--tinta); font: inherit; font-size: 12px;
      }
      .ts-linha:active { background: rgba(255, 255, 255, 0.45); }
      .ts-linha img { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; }
      .ts-linha-texto { display: flex; flex-direction: column; }
      .ts-linha-texto small { font-size: 10px; opacity: 0.8; }
      /* Construção que o caixa não cobre continua na lista, apagada: saber que
         ela existe é o que dá sentido a juntar dinheiro. */
      .ts-linha.sem-caixa { opacity: 0.45; }

      #diagnostico {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: 4px; font-size: 10px; opacity: 0.75;
        color: #f4e4c1; text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      @media (max-width: 520px) {
        .ts-barra { width: 150px; }
        #painel-acoes { width: 54vw; }
      }
    </style>
  </head>
  <body>
    <canvas id="tela"></canvas>

    <div id="hud-topo">
      <div class="ts-ficha"><img src="/tiny/ui/Icon_04.png" alt="" /><span id="hud-cz">Cz 0</span></div>
      <div class="ts-ficha"><img src="/tiny/ui/Icon_10.png" alt="" /><span id="hud-dia">Dia 1</span></div>
      <div class="ts-ficha"><img src="/tiny/ui/Icon_07.png" alt="" /><span id="hud-cidade">—</span></div>
      <div class="ts-ficha"><img src="/tiny/ui/Icon_02.png" alt="" /><span id="hud-terreno">—</span></div>
    </div>

    <div id="aviso"></div>

    <!-- O catálogo real: as 41 construções filtradas pelo nível de cidadão. A
         folha é do pacote (papel especial) e cobre a tela em celular, porque
         escolher uma construção é uma decisão que merece a tela inteira. -->
    <aside id="folha-obras" class="ts-papel" hidden>
      <header>
        <h2>CONSTRUIR</h2>
        <button id="fechar-obras" class="ts-fechar" type="button" aria-label="Fechar">×</button>
      </header>
      <p class="ts-dica">A obra sobe na célula em que o peão está pisando.</p>
      <div id="lista-obras"></div>
    </aside>

    <!-- Mercado e mochila na mesma folha: comprar e consumir são o mesmo
         gesto para o jogador, e separá-los em duas telas só somaria toques. -->
    <aside id="folha-feira" class="ts-papel" hidden>
      <header>
        <h2>MERCADO</h2>
        <button id="fechar-feira" class="ts-fechar" type="button" aria-label="Fechar">×</button>
      </header>
      <p class="ts-dica">Toque para comprar uma unidade.</p>
      <div id="lista-feira"></div>
      <h2 class="ts-secao">MOCHILA</h2>
      <div id="lista-bolsa"></div>
    </aside>

    <!-- O mapa ocupa a tela toda: escolher para onde ir é a decisão mais cara
         do jogo, e ela não cabe numa caixinha de canto. -->
    <aside id="folha-mapa" class="ts-papel" hidden>
      <header>
        <h2>O REINO</h2>
        <button id="fechar-mapa" class="ts-fechar" type="button" aria-label="Fechar">×</button>
      </header>
      <canvas id="tela-mapa"></canvas>
      <div id="ficha-viagem"></div>
    </aside>

    <div id="vitais">
      <div class="ts-barra"><i id="barra-fome" style="width:100%"></i><span>FOME</span></div>
      <div class="ts-barra"><i id="barra-sede" style="width:100%"></i><span>SEDE</span></div>
      <div class="ts-barra"><i id="barra-energia" style="width:100%"></i><span>ENERGIA</span></div>
    </div>

    <aside id="painel-acoes" class="ts-papel">
      <h2>OCUPAÇÃO</h2>
      <p id="hud-ocupacao">Ocioso</p>
      <div id="hud-acoes"></div>
      <div id="hud-terreno-botoes">
        <button id="abrir-feira" class="ts-botao" type="button">MERCADO</button>
        <button id="abrir-obras" class="ts-botao" type="button">CONSTRUIR</button>
        <button id="abrir-mapa" class="ts-botao" type="button">MAPA</button>
        <button id="dormir" class="ts-botao vermelho" type="button">DORMIR</button>
      </div>
    </aside>

    <div id="diagnostico">carregando…</div>
    <script type="module" src="/src/tiny.ts"></script>
  </body>
</html>

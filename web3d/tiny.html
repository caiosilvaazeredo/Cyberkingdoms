<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>CyberKingdoms — Tiny Swords</title>
    <style>
      /* A interface usa os elementos do próprio pacote: papel, madeira, fita e
         barras. Não é economia de trabalho — é coerência. Um painel de vidro
         escuro sobre um mundo de pixel art anuncia que a interface e o jogo
         foram feitos por pessoas diferentes. */
      :root {
        --toque: 48px;
        --madeira: #6b4b2a;
        --tinta: #3a2415;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #1c799e;
        touch-action: none; overscroll-behavior: none;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        color: #f4e4c1;
      }
      #tela { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

      /* Todo painel é a mesma folha de papel do pacote, esticada por borda de
         imagem: assim uma caixa de qualquer tamanho mantém o canto desenhado
         sem esticar o miolo. */
      /* Nove fatias de 64 px, na imagem já compactada: o pacote guarda cada
         peça numa célula separada por um vão transparente, e o `border-image`
         fatiaria o vão junto — a caixa aparece esfarelada. `ui9/` é a mesma
         arte com as peças encostadas. */
      .ts-papel {
        border-style: solid;
        border-width: 22px;
        border-image: url('/tiny/ui9/paper.png') 64 fill stretch;
        image-rendering: pixelated;
        color: var(--tinta);
      }

      #hud-topo {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 0 4px;
        font-size: 13px; font-weight: bold;
        pointer-events: none;
      }
      .ts-ficha {
        display: flex; align-items: center; gap: 6px;
        min-height: 34px; padding: 0 6px;
        border-style: solid; border-width: 16px;
        border-image: url('/tiny/ui9/paper-dark.png') 64 fill stretch;
        image-rendering: pixelated;
        color: #f2e2bd;
        pointer-events: auto;
      }
      .ts-ficha img { width: 22px; height: 22px; image-rendering: pixelated; }

      /* As barras de vitais são as do pacote: base e preenchimento separados,
         exatamente como o jogo original as usa. */
      #vitais {
        position: fixed;
        left: max(8px, env(safe-area-inset-left));
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + 4px);
        display: flex; flex-direction: column; gap: 4px;
        pointer-events: none;
      }
      /* A barra também é 3 fatias: as duas tampas de madeira não podem
         esticar, só o miolo. */
      .ts-barra {
        position: relative; width: 200px; height: 34px;
        border-style: solid; border-width: 0 22px;
        border-image: url('/tiny/ui9/bar.png') 0 64 fill stretch;
        image-rendering: pixelated;
      }
      .ts-barra i {
        position: absolute; left: 4px; right: 4px; top: 50%;
        transform: translateY(-50%);
        height: 12px;
        background: url('/tiny/ui9/bar-fill.png') left center / auto 100% repeat-x;
        image-rendering: pixelated;
        transition: width 0.25s ease;
      }
      .ts-barra span {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; color: #2a1a0d; text-shadow: 0 1px 0 rgba(255,255,255,0.35);
      }

      #painel-acoes {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + 4px);
        width: min(300px, 60vw);
        padding: 4px 8px 10px;
      }
      #painel-acoes h2 {
        margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em; text-align: center;
      }
      #hud-ocupacao {
        margin: 0 0 8px; font-size: 11px; text-align: center; min-height: 15px;
      }
      #hud-acoes { display: flex; flex-direction: column; gap: 6px; }

      /* Botão do pacote, com o estado pressionado trocando a imagem — é o
         retorno tátil que o original tem e que um `:active` de CSS puro não
         reproduz. */
      .ts-botao {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: var(--toque); padding: 2px 6px;
        border-style: solid; border-width: 16px; cursor: pointer;
        border-image: url('/tiny/ui9/btn-blue.png') 64 fill stretch;
        image-rendering: pixelated;
        background: none;
        color: #fff; font: inherit; font-size: 12px; font-weight: bold;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
      }
      .ts-botao:active {
        border-image-source: url('/tiny/ui9/btn-blue-pressed.png');
        transform: translateY(2px);
      }
      .ts-botao span { font-size: 10px; opacity: 0.85; font-weight: normal; }

      #diagnostico {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: 4px; font-size: 10px; opacity: 0.75;
        color: #f4e4c1; text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      @media (max-width: 520px) {
        .ts-barra { width: 150px; }
        #painel-acoes { width: 54vw; }
      }
    </style>
  </head>
  <body>
    <canvas id="tela"></canvas>

    <div id="hud-topo">
      <div class="ts-ficha"><img src="/tiny/ui/Icon_04.png" alt="" /><span id="hud-cz">Cz 0</span></div>
      <div class="ts-ficha"><img src="/tiny/ui/Icon_10.png" alt="" /><span id="hud-dia">Dia 1</span></div>
      <div class="ts-ficha"><img src="/tiny/ui/Icon_07.png" alt="" /><span id="hud-cidade">—</span></div>
    </div>

    <div id="vitais">
      <div class="ts-barra"><i id="barra-fome" style="width:100%"></i><span>FOME</span></div>
      <div class="ts-barra"><i id="barra-sede" style="width:100%"></i><span>SEDE</span></div>
      <div class="ts-barra"><i id="barra-energia" style="width:100%"></i><span>ENERGIA</span></div>
    </div>

    <aside id="painel-acoes" class="ts-papel">
      <h2>OCUPAÇÃO</h2>
      <p id="hud-ocupacao">Ocioso</p>
      <div id="hud-acoes"></div>
    </aside>

    <div id="diagnostico">carregando…</div>
    <script type="module" src="/src/tiny.ts"></script>
  </body>
</html>

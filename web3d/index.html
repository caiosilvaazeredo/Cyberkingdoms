<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` deixa a cena ir até a borda; as áreas seguras
         entram no CSS abaixo, para o painel não cair sob o notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fa6b8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>CyberKingdoms — mundo em 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --painel: rgba(10, 16, 26, 0.86);
        --borda: rgba(120, 200, 170, 0.3);
        --texto: #d6e4dd;
        --toque: 48px; /* alvo mínimo de toque */
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        /* Impede o "puxar para atualizar" e o quique elástico enquanto o dedo
           arrasta a câmera. Sem isto, orbitar recarrega a página no Android. */
        overscroll-behavior: none;
        touch-action: none;
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #painel {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        padding: 12px;
        border: 1px solid var(--borda);
        border-radius: 14px;
        background: var(--painel);
        backdrop-filter: blur(10px);
        color: var(--texto);
        font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        transition: transform 0.18s ease;
      }
      /* Recolhido, sobra só a barra de cima — o mundo fica inteiro visível. */
      #painel.recolhido #corpo { display: none; }

      #cabecalho {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #cabecalho h1 {
        flex: 1;
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      #alternar-painel {
        width: var(--toque);
        height: var(--toque);
        flex: 0 0 auto;
        padding: 0;
        border: 1px solid var(--borda);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.3);
        color: var(--texto);
        font: inherit;
        font-size: 18px;
        cursor: pointer;
      }

      #readout {
        margin: 8px 0 0;
        font-size: 12px;
        opacity: 0.86;
      }

      #corpo { margin-top: 10px; }

      label { display: block; margin-bottom: 4px; font-size: 11px; opacity: 0.7; }

      input {
        width: 100%;
        min-height: var(--toque);
        padding: 8px 10px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        color: var(--texto);
        /* 16px evita o zoom automático do Safari ao focar um campo. */
        font: 16px/1 ui-monospace, Menlo, Consolas, monospace;
      }

      #botoes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }
      #botoes button, #regenerate {
        min-height: var(--toque);
        padding: 8px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        background: rgba(90, 200, 160, 0.16);
        color: var(--texto);
        font: 13px/1 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      #regenerate { width: 100%; margin-top: 8px; }
      button[aria-pressed="true"] {
        background: rgba(90, 200, 160, 0.42);
        border-color: rgba(140, 240, 200, 0.7);
      }

      #sair {
        width: 100%;
        min-height: var(--toque);
        margin-top: 4px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        background: rgba(90, 200, 160, 0.16);
        color: var(--texto);
        font: 13px/1 ui-monospace, Menlo, Consolas, monospace;
        cursor: pointer;
      }

      /* ---------------------------------------------------------- telas */
      #telas { position: fixed; inset: 0; overflow-y: auto; }
      .tela {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 100%;
        padding: max(24px, env(safe-area-inset-top)) 20px
                 max(24px, env(safe-area-inset-bottom));
        background: linear-gradient(160deg, #0d1a18 0%, #0b1220 60%, #131018 100%);
        color: var(--texto);
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
      }
      .menu { justify-content: center; }
      .marca { margin-bottom: 18px; text-align: center; }
      .marca h1 { margin: 0; font-size: 28px; letter-spacing: 0.16em; }
      .subtitulo { margin: 6px 0 0; font-size: 11px; letter-spacing: 0.2em; opacity: 0.55; }
      .tela h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: 0.1em; }
      .tela h2 { margin: 14px 0 4px; font-size: 12px; letter-spacing: 0.12em; opacity: 0.65; }
      .acoes { display: flex; flex-direction: column; gap: 8px; }
      .tela button {
        min-height: var(--toque);
        padding: 10px;
        border: 1px solid var(--borda);
        border-radius: 12px;
        color: var(--texto);
        font: 14px/1.2 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .tela button.principal { background: rgba(90, 200, 160, 0.34); font-size: 16px; }
      .tela button.secundario { background: rgba(255, 255, 255, 0.05); }
      .tela button:disabled { opacity: 0.35; cursor: not-allowed; }
      .lista { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
      .save {
        display: flex !important;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        background: rgba(255, 255, 255, 0.04);
        text-align: left;
      }
      .save span { font-size: 11px; opacity: 0.6; }
      .vazio, .nota { margin: 4px 0; font-size: 11px; opacity: 0.55; }
      .erro { min-height: 16px; margin: 4px 0; color: #ff9d9d; font-size: 11px; }
      .rodape { margin-top: auto; padding-top: 20px; text-align: center; font-size: 10px; opacity: 0.35; }
      .escolhas { display: flex; flex-direction: column; gap: 8px; }
      .escolha {
        display: flex !important;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        background: rgba(255, 255, 255, 0.04);
        text-align: left;
      }
      .escolha span { font-size: 11px; font-weight: normal; opacity: 0.6; letter-spacing: 0; }
      .escolha[aria-pressed="true"] {
        background: rgba(90, 200, 160, 0.26);
        border-color: rgba(140, 240, 200, 0.6);
      }
      .tela label { display: block; margin: 8px 0 2px; font-size: 11px; opacity: 0.7; }
      .tela input {
        width: 100%;
        min-height: var(--toque);
        padding: 8px 10px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        color: var(--texto);
        font: 16px/1 ui-monospace, Menlo, Consolas, monospace;
      }
      @media (min-width: 640px) {
        .tela { max-width: 460px; margin: 0 auto; }
      }

      /* ------------------------------------------------ catálogo de obras */
      /* Dentro do painel, e não solto no rodapé: os dois disputavam o mesmo
         canto e o painel cobria o botão — clicar nele era impossível. */
      #abrir-catalogo {
        width: 100%;
        min-height: var(--toque);
        margin-bottom: 6px;
        padding: 0 18px;
        border: 1px solid var(--borda);
        border-radius: 12px;
        background: rgba(90, 200, 160, 0.28);
        backdrop-filter: blur(8px);
        color: var(--texto);
        font: 13px/1 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      #catalogo {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + 12px);
        max-height: 42vh;
        z-index: 2;
        padding: 12px;
        border: 1px solid var(--borda);
        border-radius: 14px;
        background: var(--painel);
        backdrop-filter: blur(10px);
        color: var(--texto);
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        overflow-y: auto;
        display: none;
      }
      #catalogo.aberto { display: block; }
      #catalogo h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.12em; opacity: 0.7; }
      #status-obra { min-height: 16px; margin: 0 0 8px; font-size: 11px; color: #9ff0cf; }
      #lista-construcoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
      .item-constr {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: var(--toque);
        padding: 8px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--texto);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .item-constr span { font-size: 10px; opacity: 0.6; }
      .item-constr[aria-pressed="true"] {
        background: rgba(90, 200, 160, 0.34);
        border-color: rgba(140, 240, 200, 0.7);
      }
      @media (min-width: 640px) {
        #catalogo { right: auto; width: 340px; }
      }

      #ajuda { margin: 10px 0 0; font-size: 11px; line-height: 1.6; opacity: 0.62; }
      #ajuda kbd {
        display: inline-block;
        min-width: 16px;
        padding: 1px 4px;
        border: 1px solid var(--borda);
        border-radius: 3px;
        text-align: center;
      }

      /* Aviso do limite da vila. Aparece por cima da cena, sem roubar o toque:
         o jogador continua arrastando enquanto lê. */
      #aviso {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: 50%;
        transform: translate(-50%, -12px);
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px 16px;
        border: 1px solid rgba(255, 190, 120, 0.45);
        border-radius: 12px;
        background: rgba(28, 20, 12, 0.9);
        backdrop-filter: blur(8px);
        color: #f2dfc4;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.16s ease, transform 0.16s ease;
      }
      #aviso.visivel { opacity: 1; transform: translate(-50%, 0); }
      #aviso strong { display: block; margin-bottom: 4px; font-size: 13px; letter-spacing: 0.06em; }

      /* Numa tela larga o painel volta para o canto, sem esticar. */
      @media (min-width: 640px) {
        #painel {
          left: auto;
          top: max(12px, env(safe-area-inset-top));
          bottom: auto;
          right: max(12px, env(safe-area-inset-right));
          width: 300px;
        }
      }
      /* Celular deitado: a altura é o recurso escasso, some com a ajuda. */
      @media (max-height: 460px) {
        #ajuda { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="telas"></div>

    <div id="hud" hidden>
    <div id="aviso" role="status" aria-live="polite">
      <strong id="aviso-titulo">Acesso bloqueado</strong>
      <span id="aviso-texto"></span>
    </div>

    <aside id="catalogo">
      <h2>CONSTRUÇÕES</h2>
      <p id="status-obra"></p>
      <div id="lista-construcoes"></div>
    </aside>

    <aside id="painel">
      <div id="cabecalho">
        <h1>CyberKingdoms</h1>
        <button id="alternar-painel" type="button" aria-label="Mostrar ou esconder o painel">≡</button>
      </div>
      <p id="readout">carregando…</p>

      <div id="corpo">
        <button id="abrir-catalogo" type="button">CONSTRUIR</button>
        <button id="sair" type="button">SAIR PARA O MENU</button>

        <p id="ajuda">
          <strong>Celular:</strong> um dedo arrasta o terreno, dois dedos
          aproximam, giram e inclinam.<br />
          <strong>PC:</strong> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          movem · <kbd>Q</kbd><kbd>E</kbd> giram · <kbd>R</kbd><kbd>F</kbd>
          aproximam · roda do mouse também.
        </p>
      </div>
    </aside>
    </div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>

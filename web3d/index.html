<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>CyberKingdoms — mundo em 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --painel: rgba(10, 16, 26, 0.82);
        --borda: rgba(120, 200, 170, 0.28);
        --texto: #d6e4dd;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
      #viewport { display: block; width: 100%; height: 100%; touch-action: none; }

      #painel {
        position: fixed;
        top: 12px;
        right: 12px;
        width: min(280px, calc(100vw - 24px));
        padding: 14px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        background: var(--painel);
        backdrop-filter: blur(8px);
        color: var(--texto);
        font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #painel h1 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
      #painel label { display: block; margin-bottom: 4px; opacity: 0.72; font-size: 11px; }
      #painel input {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid var(--borda);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.35);
        color: var(--texto);
        font: inherit;
      }
      #painel button {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        border: 1px solid var(--borda);
        border-radius: 6px;
        background: rgba(90, 200, 160, 0.16);
        color: var(--texto);
        font: inherit;
        cursor: pointer;
      }
      #painel button:hover { background: rgba(90, 200, 160, 0.28); }
      #readout { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--borda); opacity: 0.85; }
      #ajuda { margin: 8px 0 0; font-size: 11px; opacity: 0.6; }
      #ajuda kbd {
        padding: 1px 4px;
        border: 1px solid var(--borda);
        border-radius: 3px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <aside id="painel">
      <h1>CyberKingdoms</h1>
      <label for="seed">Seed do mundo</label>
      <input id="seed" value="captura-do-mundo" spellcheck="false" />
      <button id="regenerate" type="button">GERAR MUNDO</button>
      <p id="readout">carregando…</p>
      <p id="ajuda">
        arraste para orbitar · roda para aproximar ·
        <kbd>shift</kbd>+arraste ou botão direito para plantar grama ·
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> para caminhar ·
        <kbd>C</kbd> limpa a pintura
      </p>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: cyberkingdoms
description: "CyberKingdoms — MMORPG de economia, politica e sobrevivencia num futuro cyberpunk distopico."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Rendering do mundo isometrico.
  flame: ^1.32.0

  # Audio. `flame_audio` usa o prefixo `assets/audio/` por padrao, que e
  # exatamente como os sons estao organizados aqui.
  flame_audio: ^2.11.0

  # Estado.
  flutter_riverpod: ^2.6.1

  # Persistencia local (offline-first). Funciona em todas as plataformas,
  # inclusive web — `path_provider` nao tem implementacao para navegador e
  # lanca MissingPluginException la.
  shared_preferences: ^2.3.5

  # Backend (projeto cyberkingdoms-f1142). O app roda offline enquanto o
  # firebase_options.dart nao for gerado por `flutterfire configure`.
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Usado nos testes para verificar que os assets estao declarados no pubspec.
  yaml: ^3.1.2

flutter:
  uses-material-design: true

  # ATENCAO: a declaracao de assets do Flutter NAO e recursiva. Cada
  # subdiretorio precisa da propria linha — declarar so `assets/ui/` deixa
  # `assets/ui/bars/` de fora e as imagens falham em runtime.
  assets:
    - assets/sprites/
    - assets/data/
    - assets/ui/
    - assets/ui/bars/
    - assets/ui/panels/
    - assets/ui/hud/
    - assets/audio/ui/
    - assets/audio/game/
    - assets/audio/jingles/
    - assets/audio/combat/
    - assets/audio/music/

  fonts:
    # Fonte de texto da interface. Kenney Future cobre todo o alfabeto latino
    # com acentos, então serve para o português sem cair em fallback do sistema
    # — importante porque na web um fallback ausente renderiza texto invisível.
    - family: KenneyFuture
      fonts:
        - asset: assets/fonts/KenneyFuture.ttf
    - family: KenneyFutureNarrow
      fonts:
        - asset: assets/fonts/KenneyFutureNarrow.ttf
    # Fonte de ICONES, nao de texto: so tem glifos de botoes de controle na
    # area de uso privado (U+E000+). Nunca use como fontFamily global.
    - family: KenneyInput
      fonts:
        - asset: assets/fonts/kenney_input_generic.ttf
